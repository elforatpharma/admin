name: Build Elforat Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-admin-apk-direct.yml"
      - "android-app/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare stable Android launcher
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/elforatpharma/admin
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Elforat Admin"
                  android:resizeableActivity="true"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/elforatpharma/admin/MainActivity.java <<'EOF'
          package com.elforatpharma.admin;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceError;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final String ADMIN_URL = "https://elforatpharma.github.io/admin/";
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.WHITE);
                  getWindow().setNavigationBarColor(Color.WHITE);
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);

                  setContentView(R.layout.activity_main);
                  webView = findViewById(R.id.webview);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(true);

                  CookieManager cookies = CookieManager.getInstance();
                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return false;
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              Toast.makeText(MainActivity.this, "Unable to load Elforat Admin. Check your internet connection.", Toast.LENGTH_LONG).show();
                          }
                      }
                  });

                  webView.loadUrl(ADMIN_URL);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#4D3CEB</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#FFFFFF">

              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#FFFFFF"
                  android:overScrollMode="never" />
          </FrameLayout>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#4D3CEB"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M24,31h60v8h-60zM24,50h60v8h-60zM24,69h40v8h-40z" />
          </vector>
          EOF

          # Make this APK a new installable update.
          sed -i 's/versionCode = [0-9][0-9]*/versionCode = 3/' app/build.gradle.kts
          sed -i 's/versionName = ".*"/versionName = "1.2.0"/' app/build.gradle.kts

      - name: Build release APK
        working-directory: android-app
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK exists
        run: |
          set -euo pipefail
          test -s android-app/app/build/outputs/apk/release/app-release.apk
          ls -lh android-app/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Elforat-Admin-APK-v1.2.0
          path: android-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
