name: Build Elforat Admin APK Direct
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-admin-apk-direct.yml"
      - "android-app/**"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare Android project
        working-directory: android-app
        run: |
          printf '%s\n' 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' 'android.useAndroidX=true' > gradle.properties
          mkdir -p app/src/main/java/com/elforatpharma/admin app/src/main/res/values app/src/main/res/layout app/src/main/res/drawable
          cp ../logo.png app/src/main/res/drawable/elforat_logo.png
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:theme="@style/AppTheme" android:label="Elforat Admin"
                  android:icon="@drawable/elforat_logo" android:roundIcon="@drawable/elforat_logo"
                  android:usesCleartextTraffic="false" android:resizeableActivity="true">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/elforatpharma/admin/MainActivity.java <<'EOF'
          package com.elforatpharma.admin;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.graphics.Color;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
           private WebView webView;
           @Override public void onCreate(Bundle b) {
            super.onCreate(b);
            Window w=getWindow();
            if(Build.VERSION.SDK_INT>=30){
             w.setDecorFitsSystemWindows(false);
             w.setStatusBarColor(Color.TRANSPARENT);
             w.setNavigationBarColor(Color.TRANSPARENT);
             WindowInsetsController c=w.getInsetsController();
             if(c!=null)c.setSystemBarsAppearance(WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS,WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS);
            } else {
             w.setStatusBarColor(Color.WHITE);
             w.setNavigationBarColor(Color.WHITE);
             w.getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);
            }
            setContentView(R.layout.activity_main);
            webView=findViewById(R.id.webview);
            if(Build.VERSION.SDK_INT>=30){
             webView.setOnApplyWindowInsetsListener((v,insets)->{
              android.graphics.Insets bars=insets.getInsets(WindowInsets.Type.systemBars());
              v.setPadding(0,bars.top,0,bars.bottom);
              return insets;
             });
            }
            webView.getSettings().setJavaScriptEnabled(true);
            webView.getSettings().setDomStorageEnabled(true);
            CookieManager.getInstance().setAcceptCookie(true);
            CookieManager.getInstance().setAcceptThirdPartyCookies(webView,true);
            webView.setWebChromeClient(new WebChromeClient());
            webView.setWebViewClient(new WebViewClient());
            webView.loadUrl("https://elforatpharma.github.io/admin/");
           }
           @Override public void onBackPressed(){if(webView.canGoBack())webView.goBack();else super.onBackPressed();}
          }
          EOF
          printf '%s' '' | base64 -d > app/src/main/res/values/styles.xml
          printf '%s' '' | base64 -d > app/src/main/res/layout/activity_main.xml
          printf '%s' '' | base64 -d > app/src/main/res/drawable/ic_launcher.xml
      - name: Build
        working-directory: android-app
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Elforat-Admin-APK
          path: android-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
