          package com.elforatpharma.admin;

          import android.content.Context;
          import android.util.AttributeSet;
          import android.view.MotionEvent;
          import android.webkit.WebView;

          public class TopRefreshWebView extends WebView {
              private float downX;
              private float downY;
              private boolean startedAtTop;

              public TopRefreshWebView(Context context) {
                  super(context);
              }

              public TopRefreshWebView(Context context, AttributeSet attrs) {
                  super(context, attrs);
              }

              @Override
              public boolean onTouchEvent(MotionEvent event) {
                  switch (event.getActionMasked()) {
                      case MotionEvent.ACTION_DOWN:
                          downX = event.getX();
                          downY = event.getY();
                          startedAtTop = getScrollY() <= 0;
                          break;

                      case MotionEvent.ACTION_MOVE:
                          // IMPORTANT: never reload during MOVE. This preserves normal WebView
                          // scrolling and prevents even a tiny downward finger movement from
                          // jumping the page back to the top.
                          break;

                      case MotionEvent.ACTION_UP:
                      case MotionEvent.ACTION_CANCEL:
                          // No refresh/reload here either. Pull-to-refresh is intentionally
                          // disabled to guarantee stable scroll position.
                          break;
                  }

                  return super.onTouchEvent(event);
              }
          }
