name: Build Elforat Pharma Admin APK Final

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-admin-apk-final2.yml"
      - "android-app/**"
      - "logo.png"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android project
        working-directory: android-app
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          printf '%s\n' 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' 'android.useAndroidX=true' > gradle.properties

          mkdir -p app/src/main/java/com/elforatpharma/admin
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/java/com/elforatpharma/admin
          test -s app/google-services.json
          sed -i -E 's/versionCode = [0-9]+/versionCode = 30/; s/versionName = "[^"]+"/versionName = "1.7.6"/' app/build.gradle.kts

          convert ../logo.png -resize 512x512 -background none -gravity center -extent 512x512 app/src/main/res/drawable/launcher_logo.png
          # Create a monochrome transparent notification icon from the El-Forat logo.
          # Android notification small icons must be a clean monochrome/transparent glyph.
          # Remove the logo's white background, crop to the actual mark, then make the mark solid white.
          # Build a notification icon with the El-Forat gold background and the complete logo rendered in white.
          # Android may apply the system notification tint to small icons, so keep this asset as a clean
          # alpha mask and set the notification color to the brand gold below.
          convert ../logo.png -fuzz 15% -transparent white -trim +repage -resize '120x120>' -gravity center -background none -extent 192x192 -colorspace gray -threshold 18% -negate -alpha on app/src/main/res/drawable/notification_logo.png
          # Create a separate tightly-cropped splash logo so the Android 12+ startup screen shows the real logo clearly.
          convert ../logo.png -trim +repage -resize '460x460>' -background none -gravity center -extent 512x512 app/src/main/res/drawable/splash_logo.png

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <application
                  android:theme="@style/AppTheme"
                  android:label="الفرات فارما"
                  android:icon="@drawable/launcher_logo"
                  android:roundIcon="@drawable/launcher_logo"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true"
                  android:resizeableActivity="true"
                  android:supportsRtl="true">
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.elforatpharma.admin.fileprovider"
                      android:exported="false"
