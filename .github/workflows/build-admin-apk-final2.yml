name: Build Elforat Pharma Admin APK Final

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-admin-apk-final2.yml"
      - "android-app/**"
      - "logo.png"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android project
        working-directory: android-app
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          printf '%s\n' 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' 'android.useAndroidX=true' > gradle.properties

          mkdir -p app/src/main/java/com/elforatpharma/admin
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/java/com/elforatpharma/admin
          test -s app/google-services.json
          sed -i -E 's/versionCode = [0-9]+/versionCode = 6/; s/versionName = "[^"]+"/versionName = "1.4.1"/' app/build.gradle.kts

          convert ../logo.png -resize 512x512 -background none -gravity center -extent 512x512 app/src/main/res/drawable/launcher_logo.png

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <application
                  android:theme="@style/AppTheme"
                  android:label="الفرات فارما"
                  android:icon="@drawable/launcher_logo"
                  android:roundIcon="@drawable/launcher_logo"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true"
                  android:resizeableActivity="true"
                  android:supportsRtl="true">
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.elforatpharma.admin.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <service
                      android:name=".ElforatFirebaseMessagingService"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>

                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/elforatpharma/admin/ElforatFirebaseMessagingService.java <<'EOF'
          package com.elforatpharma.admin;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          public class ElforatFirebaseMessagingService extends FirebaseMessagingService {
              private static final String CHANNEL_ID = "orders";
              @Override public void onMessageReceived(RemoteMessage message) {
                  String title = message.getNotification() != null && message.getNotification().getTitle() != null ? message.getNotification().getTitle() : "طلب جديد — الفرات فارما";
                  String body = message.getNotification() != null && message.getNotification().getBody() != null ? message.getNotification().getBody() : "يوجد طلب جديد في لوحة التحكم.";
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "طلبات الفرات فارما", NotificationManager.IMPORTANCE_HIGH);
                      ch.setDescription("إشعارات الطلبات الجديدة");
                      ch.enableVibration(true);
                      nm.createNotificationChannel(ch);
                  }
                  Intent intent = new Intent(this, MainActivity.class);
                  intent.setFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent pi = PendingIntent.getActivity(this, 1001, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setSmallIcon(com.elforatpharma.admin.R.drawable.launcher_logo)
                          .setContentTitle(title).setContentText(body)
                          .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                          .setPriority(NotificationCompat.PRIORITY_HIGH).setAutoCancel(true).setContentIntent(pi);
                  nm.notify((int) System.currentTimeMillis(), builder.build());
              }
              @Override public void onNewToken(String token) {
                  getSharedPreferences("elforat_admin", MODE_PRIVATE).edit().putString("fcm_token", token).apply();
              }
          }
          EOF

          cat > app/src/main/java/com/elforatpharma/admin/MainActivity.java <<'EOF'
          package com.elforatpharma.admin;

          import android.Manifest;
          import androidx.fragment.app.FragmentActivity;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceError;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          import java.util.concurrent.Executor;

          public class MainActivity extends FragmentActivity {
              private static final String ADMIN_URL = "https://elforatpharma.github.io/admin/";
              private static final String PREFS = "elforat_admin";
              private static final String BIO_ENABLED = "biometric_enabled";
              private WebView webView;
              private SwipeRefreshLayout refresh;
              private ValueCallback<Uri[]> uploadCallback;
              private boolean biometricInProgress;

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  configureBars();

                  FrameLayout root = new FrameLayout(this);
                  refresh = new SwipeRefreshLayout(this);
                  refresh.setColorSchemeColors(Color.rgb(77,60,235), Color.rgb(133,54,255));
                  webView = new WebView(this);
                  refresh.addView(webView, new FrameLayout.LayoutParams(-1,-1));
                  root.addView(refresh, new FrameLayout.LayoutParams(-1,-1));
                  setContentView(root);

                  configureWebView();
                  refresh.setOnRefreshListener(() -> webView.reload());
                  createNotificationChannel();
                  requestNotificationPermission();
                  subscribeToOrderTopic();
                  AppUpdater.check(this);

                  if (getSharedPreferences(PREFS, MODE_PRIVATE).getBoolean(BIO_ENABLED, false) && biometricAvailable())
                      showBiometricGate();
                  else webView.loadUrl(ADMIN_URL);
              }

              private void configureBars() {
                  Window w = getWindow();
                  w.setStatusBarColor(Color.WHITE);
                  w.setNavigationBarColor(Color.WHITE);
                  if (Build.VERSION.SDK_INT >= 28) w.setNavigationBarDividerColor(Color.WHITE);
                  w.getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR | View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR);
              }

              private boolean biometricAvailable() {
                  int r = BiometricManager.from(this).canAuthenticate(
                      BiometricManager.Authenticators.BIOMETRIC_STRONG | BiometricManager.Authenticators.BIOMETRIC_WEAK);
                  return r == BiometricManager.BIOMETRIC_SUCCESS;
              }

              private void showBiometricGate() {
                  if (biometricInProgress) return;
                  biometricInProgress = true;
                  Executor ex = ContextCompat.getMainExecutor(this);
                  BiometricPrompt prompt = new BiometricPrompt(this, ex, new BiometricPrompt.AuthenticationCallback() {
                      @Override public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {
                          biometricInProgress = false;
                          webView.loadUrl(ADMIN_URL);
                      }
                      @Override public void onAuthenticationError(int code, CharSequence msg) {
                          biometricInProgress = false;
                          Toast.makeText(MainActivity.this, "استخدم البصمة للدخول إلى لوحة التحكم", Toast.LENGTH_LONG).show();
                          new android.os.Handler().postDelayed(() -> showBiometricGate(), 700);
                      }
                      @Override public void onAuthenticationFailed() {
                          Toast.makeText(MainActivity.this, "لم يتم التعرف على البصمة", Toast.LENGTH_SHORT).show();
                      }
                  });
                  BiometricPrompt.PromptInfo info = new BiometricPrompt.PromptInfo.Builder()
                      .setTitle("الفرات فارما")
                      .setSubtitle("تأكيد الهوية للدخول إلى لوحة التحكم")
                      .setNegativeButtonText("استخدام تسجيل الدخول")
                      .build();
                  prompt.authenticate(info);
              }

              private void configureWebView() {
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadsImagesAutomatically(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(true);
                  s.setSupportZoom(false);

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (uploadCallback != null) uploadCallback.onReceiveValue(null);
                          uploadCallback = callback;
                          try {
                              startActivityForResult(params.createIntent(), 7001);
                          } catch (Exception e) {
                              Intent camera = new Intent(android.provider.MediaStore.ACTION_IMAGE_CAPTURE);
                              try { startActivityForResult(camera, 7001); }
                              catch (Exception ignored) { uploadCallback = null; return false; }
                          }
                          return true;
                      }
                  });

                  webView.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) { return false; }
                      @Override public void onPageFinished(WebView view, String url) {
                          refresh.setRefreshing(false);
                          if (url.contains("admin.html") || url.contains("orders.html") || url.contains("inventory.html"))
                              getSharedPreferences(PREFS, MODE_PRIVATE).edit().putBoolean(BIO_ENABLED, true).apply();
                          injectTheme(view);
                      }
                      @Override public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              refresh.setRefreshing(false);
                              Toast.makeText(MainActivity.this, "تعذر تحميل لوحة التحكم. تحقق من الإنترنت.", Toast.LENGTH_LONG).show();
                          }
                      }
                  });
              }

              private void injectTheme(WebView view) {
                  boolean dark = (getResources().getConfiguration().uiMode & 0x30) == 0x20;
                  String css = dark
                      ? "body{background:#0f172a!important;color:#e5e7eb!important}" +
                        "header,aside,.bg-white,.bg-white/80,.bg-slate-50,.bg-gray-50{background-color:#111827!important;color:#e5e7eb!important}" +
                        ".text-gray-900,.text-slate-800,.text-slate-700{color:#f3f4f6!important}" +
                        ".text-gray-500,.text-slate-500,.text-gray-400{color:#cbd5e1!important}" +
                        "input,select,textarea{background:#1f2937!important;color:#fff!important;border-color:#374151!important}"
                      : "";
                  String q = "'" + css.replace("\\","\\\\").replace("'","\\'") + "'";
                  view.evaluateJavascript("(function(){var x=document.getElementById('native-dark-mode');if(x)x.remove();var s=document.createElement('style');s.id='native-dark-mode';s.innerHTML="+q+";document.head.appendChild(s);})()", null);
              }

          private void subscribeToOrderTopic() {
              com.google.firebase.messaging.FirebaseMessaging.getInstance().subscribeToTopic("admin_orders")
                  .addOnCompleteListener(task -> {
                      if (!task.isSuccessful()) android.util.Log.w("ElforatFCM", "Topic subscription failed", task.getException());
                  });
          }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel("orders", "طلبات الفرات فارما", NotificationManager.IMPORTANCE_HIGH);
                      ch.setDescription("إشعارات طلبات لوحة التحكم");
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                  }
              }

              private void requestNotificationPermission() {
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 9001);
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == 7001 && uploadCallback != null) {
                      Uri[] results = null;
                      if (resultCode == RESULT_OK && data != null) {
                          if (data.getData() != null) results = new Uri[]{data.getData()};
                          else if (data.getClipData() != null) {
                              int n = data.getClipData().getItemCount();
                              results = new Uri[n];
                              for (int i=0;i<n;i++) results[i] = data.getClipData().getItemAt(i).getUri();
                          }
                      }
                      uploadCallback.onReceiveValue(results);
                      uploadCallback = null;
                  }
              }

              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }

              @Override protected void onDestroy() {
                  if (webView != null) { webView.stopLoading(); webView.destroy(); }
                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.swiperefreshlayout.widget.SwipeRefreshLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent">
              <WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#FFFFFF" />
          </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#4D3CEB</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          mkdir -p app/src/main/res/values-v31
          mkdir -p app/src/main/res/xml

          cat > app/src/main/res/values-v31/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#4D3CEB</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowSplashScreenBackground">#FFFFFF</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/launcher_logo</item>
              </style>
          </resources>
          EOF
      - name: Build release APK
        working-directory: android-app
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -s android-app/app/build/outputs/apk/release/app-release.apk
          ls -lh android-app/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.2
          name: Elforat Pharma Admin v1.4.2
          generate_release_notes: true
          files: android-app/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Elforat-Pharma-Admin-APK-v1.4.2
          path: android-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

# Firebase FCM integration build marker
