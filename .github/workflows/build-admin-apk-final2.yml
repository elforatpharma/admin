          package com.elforatpharma.admin;

          import android.content.BroadcastReceiver;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.BitmapFactory;
          import android.os.Bundle;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;

          public class NotificationActionReceiver extends BroadcastReceiver {
              public static final String ACTION_CONFIRM = "com.elforatpharma.admin.ACTION_CONFIRM";
              public static final String ACTION_REJECT = "com.elforatpharma.admin.ACTION_REJECT";
              public static final String ACTION_ACKNOWLEDGE = "com.elforatpharma.admin.ACTION_ACKNOWLEDGE";
              public static final String ACTION_SNOOZE = "com.elforatpharma.admin.ACTION_SNOOZE";
              public static final String ACTION_SNOOZE_REMIND = "com.elforatpharma.admin.ACTION_SNOOZE_REMIND";
              public static final String EXTRA_TITLE = "notification_title";
              public static final String EXTRA_BODY = "notification_body";
              public static final String EXTRA_TOKEN = "action_token";
              public static final String EXTRA_ORDER_ID = "order_id";
              public static final String EXTRA_NOTIFICATION_ID = "notification_id";
              private static final String ENDPOINT = "https://sidtdxchiqiogfkwbdui.supabase.co/functions/v1/admin-notification-action";

              @Override public void onReceive(Context context, Intent intent) {
                  String action = intent.getAction();
                  if (ACTION_ACKNOWLEDGE.equals(action)) {
                      cancelAndToast(context, intent, "تم تأكيد استلام الإشعار");
                      return;
                  }
                  if (ACTION_SNOOZE.equals(action)) {
                      scheduleSnooze(context, intent);
                      cancelAndToast(context, intent, "تم تأجيل الإشعار لمدة 15 دقيقة");
                      return;
                  }
                  if (ACTION_SNOOZE_REMIND.equals(action)) {
                      postReminder(context, intent.getStringExtra(EXTRA_TITLE), intent.getStringExtra(EXTRA_BODY), intent.getStringExtra(EXTRA_ORDER_ID));
                      return;
                  }
                  final PendingResult pending = goAsync();
                  final String token = intent.getStringExtra(EXTRA_TOKEN);
                  final String orderId = intent.getStringExtra(EXTRA_ORDER_ID);
                  final int notificationId = intent.getIntExtra(EXTRA_NOTIFICATION_ID, -1);
                  final boolean confirm = ACTION_CONFIRM.equals(intent.getAction());

                  new Thread(() -> {
                      int code = 0;
                      String response = "";
                      try {
                          URL url = new URL(ENDPOINT);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setConnectTimeout(8000);
                          conn.setReadTimeout(8000);
                          conn.setDoOutput(true);
                          conn.setRequestProperty("Content-Type", "application/json");
                          String json = "{\"token\":\"" + escape(token) + "\"}";
                          try (OutputStream os = conn.getOutputStream()) {
                              os.write(json.getBytes(StandardCharsets.UTF_8));
                          }
                          code = conn.getResponseCode();
                          response = code >= 200 && code < 300 ? "تم " + (confirm ? "تأكيد" : "رفض") + " الطلب #" + orderId : "تعذر تنفيذ الإجراء";
                          conn.disconnect();
                      } catch (Exception e) {
                          response = "تعذر تنفيذ الإجراء. تحقق من الإنترنت.";
                      }

                      final String message = response;
                      final int resultCode = code;
                      new android.os.Handler(context.getMainLooper()).post(() -> {
                          NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (resultCode >= 200 && resultCode < 300 && notificationId >= 0) {
                              nm.cancel(notificationId);
                              nm.notify((int)(System.currentTimeMillis() & 0x7fffffff),
                                      new androidx.core.app.NotificationCompat.Builder(context, ElforatFirebaseMessagingService.CHANNEL_ID)
                                              .setSmallIcon(R.drawable.notification_logo)
                                              .setColor(android.graphics.Color.rgb(212, 166, 42))
                                              .setColorized(true)
                                              .setContentTitle("الفرات فارما")
                                              .setContentText(message)
                                              .setAutoCancel(true)
                                              .setPriority(androidx.core.app.NotificationCompat.PRIORITY_HIGH)
                                              .build());
                              int count = context.getSharedPreferences(ElforatFirebaseMessagingService.PREFS, Context.MODE_PRIVATE)
                                      .getInt(ElforatFirebaseMessagingService.COUNT_KEY, 1);
                              context.getSharedPreferences(ElforatFirebaseMessagingService.PREFS, Context.MODE_PRIVATE)
                                      .edit().putInt(ElforatFirebaseMessagingService.COUNT_KEY, Math.max(0, count - 1)).apply();
                          } else {
                              android.widget.Toast.makeText(context, message, android.widget.Toast.LENGTH_LONG).show();
                          }
                          pending.finish();
                      });
                  }).start();
              }

              private static void cancelAndToast(Context context, Intent intent, String message) {
                  int id = intent.getIntExtra(EXTRA_NOTIFICATION_ID, -1);
                  if (id >= 0) ((NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE)).cancel(id);
                  android.content.SharedPreferences prefs = context.getSharedPreferences(ElforatFirebaseMessagingService.PREFS, Context.MODE_PRIVATE);
                  prefs.edit().putInt(ElforatFirebaseMessagingService.COUNT_KEY, Math.max(0, prefs.getInt(ElforatFirebaseMessagingService.COUNT_KEY, 1) - 1)).apply();
                  android.widget.Toast.makeText(context, message, android.widget.Toast.LENGTH_SHORT).show();
              }

              private static void scheduleSnooze(Context context, Intent source) {
                  String orderId = source.getStringExtra(EXTRA_ORDER_ID);
                  Intent reminder = new Intent(context, NotificationActionReceiver.class);
                  reminder.setAction(ACTION_SNOOZE_REMIND);
                  reminder.putExtra(EXTRA_ORDER_ID, orderId);
                  reminder.putExtra(EXTRA_TITLE, source.getStringExtra(EXTRA_TITLE));
                  reminder.putExtra(EXTRA_BODY, source.getStringExtra(EXTRA_BODY));
                  int requestCode = Math.abs((orderId == null ? "" : orderId).hashCode()) + 60;
                  android.app.PendingIntent pi = android.app.PendingIntent.getBroadcast(context, requestCode, reminder, android.app.PendingIntent.FLAG_UPDATE_CURRENT | android.app.PendingIntent.FLAG_IMMUTABLE);
                  android.app.AlarmManager alarm = (android.app.AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                  if (alarm != null) {
                      long when = System.currentTimeMillis() + 15L * 60L * 1000L;
                      if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.M) alarm.setAndAllowWhileIdle(android.app.AlarmManager.RTC_WAKEUP, when, pi);
                      else alarm.set(android.app.AlarmManager.RTC_WAKEUP, when, pi);
                  }
              }

