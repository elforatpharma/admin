          package com.elforatpharma.admin;

          import android.content.Context;
          import android.util.AttributeSet;
          import android.view.MotionEvent;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;

          public class TopOnlySwipeRefreshLayout extends SwipeRefreshLayout {
              private boolean startedAtTop;
              private float downY;
              private int touchSlop;

              public TopOnlySwipeRefreshLayout(Context context) {
                  super(context);
                  init();
              }

              public TopOnlySwipeRefreshLayout(Context context, AttributeSet attrs) {
                  super(context, attrs);
                  init();
              }

              private void init() {
                  touchSlop = android.view.ViewConfiguration.get(getContext()).getScaledTouchSlop();
              }

              @Override
              public boolean onInterceptTouchEvent(MotionEvent ev) {
                  final int action = ev.getActionMasked();

                  if (action == MotionEvent.ACTION_DOWN) {
                      downY = ev.getY();
                      startedAtTop = !canChildScrollUp();
                      // If the page is not at the very top, WebView owns this gesture completely.
                      if (!startedAtTop) return false;
                      return super.onInterceptTouchEvent(ev);
                  }

                  if (!startedAtTop) return false;

                  if (action == MotionEvent.ACTION_MOVE) {
                      float dy = ev.getY() - downY;
                      // Only a downward gesture that exceeds touch slop can trigger refresh.
                      if (dy <= touchSlop) return false;
                  }

                  if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_CANCEL) {
                      return super.onInterceptTouchEvent(ev);
                  }

                  return super.onInterceptTouchEvent(ev);
              }

              @Override
              public boolean canChildScrollUp() {
                  if (getChildCount() == 0) return false;
                  android.view.View child = getChildAt(0);
                  return child.canScrollVertically(-1);
              }
          }
