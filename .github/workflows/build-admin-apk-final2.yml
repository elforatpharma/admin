                  open.setFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  int base = Math.abs((orderId == null ? "" : orderId).hashCode());
                  android.app.PendingIntent openPi = android.app.PendingIntent.getActivity(context, base + 10, open, android.app.PendingIntent.FLAG_UPDATE_CURRENT | android.app.PendingIntent.FLAG_IMMUTABLE);
                  int notificationId = (int)(System.currentTimeMillis() & 0x7fffffff);
                  androidx.core.app.NotificationCompat.Builder b = new androidx.core.app.NotificationCompat.Builder(context, ElforatFirebaseMessagingService.CHANNEL_ID)
                      .setSmallIcon(R.drawable.notification_logo).setColor(android.graphics.Color.rgb(212,166,42)).setColorized(true)
                      .setContentTitle(title == null || title.isEmpty() ? "الفرات فارما" : title)
                      .setContentText(body == null || body.isEmpty() ? "تذكير بمتابعة الطلب #" + orderId : body)
                      .setStyle(new androidx.core.app.NotificationCompat.BigTextStyle().bigText(body == null ? "" : body))
                      .setPriority(androidx.core.app.NotificationCompat.PRIORITY_HIGH).setAutoCancel(true).setContentIntent(openPi);
                  Intent ack = new Intent(context, NotificationActionReceiver.class); ack.setAction(ACTION_ACKNOWLEDGE); ack.putExtra(EXTRA_ORDER_ID, orderId); ack.putExtra(EXTRA_NOTIFICATION_ID, notificationId);
                  Intent snooze = new Intent(context, NotificationActionReceiver.class); snooze.setAction(ACTION_SNOOZE); snooze.putExtra(EXTRA_ORDER_ID, orderId); snooze.putExtra(EXTRA_TITLE, title); snooze.putExtra(EXTRA_BODY, body); snooze.putExtra(EXTRA_NOTIFICATION_ID, notificationId);
                  android.app.PendingIntent ackPi = android.app.PendingIntent.getBroadcast(context, base + 40, ack, android.app.PendingIntent.FLAG_UPDATE_CURRENT | android.app.PendingIntent.FLAG_IMMUTABLE);
                  android.app.PendingIntent snoozePi = android.app.PendingIntent.getBroadcast(context, base + 50, snooze, android.app.PendingIntent.FLAG_UPDATE_CURRENT | android.app.PendingIntent.FLAG_IMMUTABLE);
                  b.addAction(new androidx.core.app.NotificationCompat.Action.Builder(android.R.drawable.ic_menu_view, "فتح الطلب", openPi).build());
                  b.addAction(new androidx.core.app.NotificationCompat.Action.Builder(android.R.drawable.ic_menu_send, "تأكيد الاستلام", ackPi).build());
                  b.addAction(new androidx.core.app.NotificationCompat.Action.Builder(android.R.drawable.ic_lock_idle_alarm, "تأجيل 15 دقيقة", snoozePi).build());
                  nm.notify(notificationId, b.build());
                  android.content.SharedPreferences prefs = context.getSharedPreferences(ElforatFirebaseMessagingService.PREFS, Context.MODE_PRIVATE);
                  prefs.edit().putInt(ElforatFirebaseMessagingService.COUNT_KEY, prefs.getInt(ElforatFirebaseMessagingService.COUNT_KEY, 0) + 1).apply();
              }

              private static String escape(String s) {
                  return s == null ? "" : s.replace("\\", "\\\\").replace("\"", "\\\"");
              }
          }
