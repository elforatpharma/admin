name: Build Elforat Admin APK Final 2
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-admin-apk-final2.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare Android project
        working-directory: android-app
        run: |
          printf '%s\n' 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' 'android.useAndroidX=true' > gradle.properties
          mkdir -p app/src/main/java/com/elforatpharma/admin app/src/main/res/values app/src/main/res/layout app/src/main/res/drawable
          printf '%s' '' | base64 -d > app/src/main/AndroidManifest.xml
          printf '%s' ' T3ZlcnJpZGUgcHVibGljIHZvaWQgb25CYWNrUHJlc3NlZCgpe2lmKHdlYlZpZXcuY2FuR29CYWNrKCkpd2ViVmlldy5nb0JhY2soKTtlbHNlIHN1cGVyLm9uQmFja1ByZXNzZWQoKTt9fQ==' | tr -d ' ' | base64 -d > app/src/main/java/com/elforatpharma/admin/MainActivity.java
          printf '%s' '' | base64 -d > app/src/main/res/values/styles.xml
          printf '%s' '' | base64 -d > app/src/main/res/layout/activity_main.xml
          printf '%s' '' | base64 -d > app/src/main/res/drawable/ic_launcher.xml
      - name: Build
        working-directory: android-app
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Elforat-Admin-APK
          path: android-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
