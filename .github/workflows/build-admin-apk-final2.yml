          import android.webkit.WebResourceError;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowInsetsCompat;
          import java.util.concurrent.Executor;

          public class MainActivity extends FragmentActivity {
              private static final String ADMIN_URL = "https://elforatpharma.github.io/admin/";
              private static final String PREFS = "elforat_admin";
              private static final String BIO_ENABLED = "biometric_enabled";
              private WebView webView;
              private ValueCallback<Uri[]> uploadCallback;
              private static final String OFFLINE_DIR = "offline";
              private static final String OFFLINE_ARCHIVE = "admin_offline.mht";
              private boolean biometricInProgress;

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  configureBars();

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.WHITE);
                  webView = new TopRefreshWebView(this);
                  root.addView(webView, new FrameLayout.LayoutParams(-1,-1));
                  setContentView(root);
                  ViewCompat.setOnApplyWindowInsetsListener(root, (v, insets) -> {
                      Insets bars = insets.getInsets(WindowInsetsCompat.Type.systemBars());
                      v.setPadding(0, bars.top, 0, bars.bottom);
                      return insets;
                  });
                  ViewCompat.requestApplyInsets(root);

                  configureWebView();
                  createNotificationChannel();
                  requestNotificationPermission();
                  subscribeToOrderTopic();
                  AppUpdater.check(this);

                  boolean biometricEnabled = getSharedPreferences(PREFS, MODE_PRIVATE)
                          .getBoolean(BIO_ENABLED, false);

                  String deepLinkUrl = getIntent().getStringExtra("deep_link_url");
                  if (biometricEnabled && biometricAvailable()) {
                      showBiometricGate(deepLinkUrl);
                  } else {
                      loadAdminOrOffline(deepLinkUrl);
                  }
              }

              @Override protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  String deepLinkUrl = intent == null ? null : intent.getStringExtra("deep_link_url");
                  if (deepLinkUrl != null && !deepLinkUrl.isEmpty()) {
                      // Handle notification taps when the dashboard activity is already alive.
                      loadAdminOrOffline(deepLinkUrl);
                  }
              }

              private void configureBars() {
                  Window w = getWindow();
                  w.setStatusBarColor(Color.WHITE);
                  w.setNavigationBarColor(Color.WHITE);
                  if (Build.VERSION.SDK_INT >= 28) w.setNavigationBarDividerColor(Color.WHITE);
                  w.getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR | View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR);
              }

              private boolean biometricAvailable() {
                  int r = BiometricManager.from(this).canAuthenticate(
                      BiometricManager.Authenticators.BIOMETRIC_STRONG);
                  return r == BiometricManager.BIOMETRIC_SUCCESS;
              }

              private void showBiometricGate(String deepLinkUrl) {
                  if (biometricInProgress) return;
                  biometricInProgress = true;

                  Executor ex = ContextCompat.getMainExecutor(this);
                  BiometricPrompt prompt = new BiometricPrompt(this, ex, new BiometricPrompt.AuthenticationCallback() {
                      @Override public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {
                          biometricInProgress = false;
                          loadAdminOrOffline(deepLinkUrl);
                      }

                      @Override public void onAuthenticationError(int code, CharSequence msg) {
                          biometricInProgress = false;

                          // "استخدام تسجيل الدخول" is a genuine fallback, not a loop.
                          if (code == BiometricPrompt.ERROR_NEGATIVE_BUTTON) {
                              loadAdminOrOffline(deepLinkUrl);
                              return;
                          }

                          Toast.makeText(MainActivity.this, "استخدم بصمة الإصبع للدخول إلى لوحة التحكم", Toast.LENGTH_LONG).show();
                          new android.os.Handler().postDelayed(() -> {
                              if (!isFinishing() && !isDestroyed()) showBiometricGate(deepLinkUrl);
                          }, 700);
                      }

                      @Override public void onAuthenticationFailed() {
                          Toast.makeText(MainActivity.this, "لم يتم التعرف على البصمة", Toast.LENGTH_SHORT).show();
                      }
                  });

                  BiometricPrompt.PromptInfo info = new BiometricPrompt.PromptInfo.Builder()
                      .setTitle("تسجيل الدخول ببصمة الإصبع")
                      .setSubtitle("ضع إصبعك على مستشعر البصمة لفتح لوحة التحكم")
                      .setNegativeButtonText("استخدام تسجيل الدخول")
                      .build();

                  prompt.authenticate(info);
              }

              private boolean hasNetwork() {
                  try {
                      android.net.ConnectivityManager cm = (android.net.ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE);
                      android.net.Network network = cm.getActiveNetwork();
                      if (network == null) return false;
                      android.net.NetworkCapabilities caps = cm.getNetworkCapabilities(network);
                      return caps != null && caps.hasCapability(android.net.NetworkCapabilities.NET_CAPABILITY_INTERNET)
                              && caps.hasCapability(android.net.NetworkCapabilities.NET_CAPABILITY_VALIDATED);
                  } catch (Exception ignored) {
                      return false;
                  }
              }

              private java.io.File getOfflineArchive() {
                  java.io.File dir = new java.io.File(getFilesDir(), OFFLINE_DIR);
                  if (!dir.exists()) dir.mkdirs();
                  return new java.io.File(dir, OFFLINE_ARCHIVE);
              }

              private boolean offlineLoadAttempted = false;

              private void loadAdminOrOffline(String deepLinkUrl) {
                  String target = deepLinkUrl == null || deepLinkUrl.isEmpty() ? ADMIN_URL : deepLinkUrl;
                  java.io.File archive = getOfflineArchive();
                  boolean offline = !hasNetwork();

                  offlineLoadAttempted = false;
                  webView.getSettings().setCacheMode(offline ? WebSettings.LOAD_CACHE_ONLY : WebSettings.LOAD_DEFAULT);

                  // Keep the real HTTPS origin while offline so the Service Worker,
                  // Material Symbols font cache, DOM storage and cached Supabase GET
                  // responses can still work. The local MHT archive is only a fallback.
                  if (offline) {
                      webView.loadUrl(target);
                      return;
                  }

                  webView.loadUrl(target);
              }

              private void saveOfflineArchive() {
                  if (!hasNetwork() || webView == null) return;
                  try {
                      java.io.File archive = getOfflineArchive();
                      webView.saveWebArchive(archive.getAbsolutePath(), false, path -> {
                          if (path != null) {
                              android.util.Log.i("ElforatOffline", "Offline archive saved: " + path);
                          }
                      });
                  } catch (Exception e) {
                      android.util.Log.e("ElforatOffline", "Failed to save offline archive", e);
                  }
              }

              private void configureWebView() {
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadsImagesAutomatically(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(true);
                  s.setSupportZoom(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  // The archive is app-owned; do not allow local files to access arbitrary remote origins.
                  s.setAllowFileAccess(true);
                  s.setAllowUniversalAccessFromFileURLs(false);
                  s.setAllowFileAccessFromFileURLs(false);

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (uploadCallback != null) uploadCallback.onReceiveValue(null);
                          uploadCallback = callback;
                          try {
                              startActivityForResult(params.createIntent(), 7001);
                          } catch (Exception e) {
                              Intent camera = new Intent(android.provider.MediaStore.ACTION_IMAGE_CAPTURE);
                              try { startActivityForResult(camera, 7001); }
                              catch (Exception ignored) { uploadCallback = null; return false; }
                          }
                          return true;
                      }
                  });

                  webView.setWebViewClient(new WebViewClient() {
                      private boolean openExternalAppUrl(String url) {
                          if (url == null || url.trim().isEmpty()) return false;
                          Uri uri;
                          try {
                              uri = Uri.parse(url);
                          } catch (Exception ignored) {
                              return false;
                          }

                          String scheme = uri.getScheme() == null ? "" : uri.getScheme().toLowerCase(java.util.Locale.US);
                          String host = uri.getHost() == null ? "" : uri.getHost().toLowerCase(java.util.Locale.US);

                          boolean whatsapp =
                                  "whatsapp".equals(scheme) ||
                                  "wa.me".equals(host) ||
                                  "api.whatsapp.com".equals(host) ||
                                  "web.whatsapp.com".equals(host) ||
                                  "whatsapp.com".equals(host) ||
                                  host.endsWith(".whatsapp.com");

                          boolean externalScheme =
                                  "tel".equals(scheme) ||
                                  "mailto".equals(scheme) ||
                                  "sms".equals(scheme) ||
                                  "geo".equals(scheme) ||
                                  "market".equals(scheme);

                          if (!whatsapp && !externalScheme) return false;

                          try {
                              Intent intent = new Intent(Intent.ACTION_VIEW, uri);
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                              return true;
                          } catch (Exception e) {
                              // If the WhatsApp app is not installed, allow https links to
                              // continue in the WebView/browser instead of breaking navigation.
                              if (whatsapp && ("http".equals(scheme) || "https".equals(scheme))) {
                                  return false;
                              }
                              return true;
                          }
                      }

                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          if (request == null || request.getUrl() == null) return false;
                          return openExternalAppUrl(request.getUrl().toString());
                      }

                      @Override public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return openExternalAppUrl(url);
                      }

                      @Override public void onPageFinished(WebView view, String url) {
                          if (url != null && url.contains("/admin.html")) {
                              getSharedPreferences(PREFS, MODE_PRIVATE)
                                      .edit()
                                      .putBoolean(BIO_ENABLED, true)
                                      .apply();
                          }
                          injectTheme(view);
                          new android.os.Handler(getMainLooper()).postDelayed(() -> saveOfflineArchive(), 10000);
                      }
                      @Override public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              if (!hasNetwork() && !offlineLoadAttempted) {
                                  offlineLoadAttempted = true;
                                  java.io.File archive = getOfflineArchive();
                                  if (archive.exists() && archive.length() > 0) {
                                      view.loadUrl(android.net.Uri.fromFile(archive).toString());
                                      Toast.makeText(MainActivity.this, "وضع Offline — عرض آخر نسخة محفوظة", Toast.LENGTH_SHORT).show();
                                      return;
                                  }
                              }
                              Toast.makeText(MainActivity.this, "تعذر تحميل لوحة التحكم. افتحها مرة بالإنترنت أولاً.", Toast.LENGTH_LONG).show();
                          }
                      }
                  });
              }

              private void injectTheme(WebView view) {
                  boolean dark = (getResources().getConfiguration().uiMode & 0x30) == 0x20;
                  String css = dark
                      ? "body{background:#0f172a!important;color:#e5e7eb!important}" +
                        "header,aside,.bg-white,.bg-white/80,.bg-slate-50,.bg-gray-50{background-color:#111827!important;color:#e5e7eb!important}" +
                        ".text-gray-900,.text-slate-800,.text-slate-700{color:#f3f4f6!important}" +
                        ".text-gray-500,.text-slate-500,.text-gray-400{color:#cbd5e1!important}" +
                        "input,select,textarea{background:#1f2937!important;color:#fff!important;border-color:#374151!important}"
                      : "";
                  String q = "'" + css.replace("\\","\\\\").replace("'","\\'") + "'";
                  view.evaluateJavascript("(function(){var x=document.getElementById('native-dark-mode');if(x)x.remove();var s=document.createElement('style');s.id='native-dark-mode';s.innerHTML="+q+";document.head.appendChild(s);})()", null);
              }

          private void clearNotificationCount() {
              getSharedPreferences("elforat_admin", MODE_PRIVATE).edit()
                      .putInt("notification_count", 0)
                      .apply();
          }

          private void subscribeToOrderTopic() {
              com.google.firebase.messaging.FirebaseMessaging.getInstance().getToken()
                  .addOnCompleteListener(tokenTask -> {
                      if (!tokenTask.isSuccessful()) {
                          android.util.Log.e("ElforatFCM", "FCM token fetch failed", tokenTask.getException());
                          return;
                      }
                      getSharedPreferences("elforat_admin", MODE_PRIVATE).edit()
                              .putString("fcm_token", tokenTask.getResult()).apply();
                      com.google.firebase.messaging.FirebaseMessaging.getInstance().subscribeToTopic("admin_orders")
                          .addOnCompleteListener(task -> {
                              if (task.isSuccessful()) android.util.Log.i("ElforatFCM", "Topic subscription succeeded: admin_orders");
                              else android.util.Log.e("ElforatFCM", "Topic subscription failed: admin_orders", task.getException());
                          });
                  });
          }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel("orders_alerts_v2", "طلبات الفرات فارما", NotificationManager.IMPORTANCE_HIGH);
                      ch.setDescription("إشعارات طلبات لوحة التحكم");
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                  }
              }

              private void requestNotificationPermission() {
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 9001);
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == 7001 && uploadCallback != null) {
                      Uri[] results = null;
                      if (resultCode == RESULT_OK && data != null) {
                          if (data.getData() != null) results = new Uri[]{data.getData()};
                          else if (data.getClipData() != null) {
                              int n = data.getClipData().getItemCount();
                              results = new Uri[n];
                              for (int i=0;i<n;i++) results[i] = data.getClipData().getItemAt(i).getUri();
                          }
                      }
                      uploadCallback.onReceiveValue(results);
                      uploadCallback = null;
                  }
              }

              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }

              @Override protected void onDestroy() {
                  if (webView != null) { webView.stopLoading(); webView.destroy(); }
                  super.onDestroy();
              }
          }
