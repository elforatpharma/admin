name: Build Elforat Pharma Admin APK Final

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-admin-apk-final2.yml"
      - "android-app/**"
      - "logo.png"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android project
        working-directory: android-app
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          printf '%s\n' 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' 'android.useAndroidX=true' > gradle.properties

          mkdir -p app/src/main/java/com/elforatpharma/admin
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable

          convert ../logo.png -resize 512x512 -background none -gravity center -extent 512x512 app/src/main/res/drawable/launcher_logo.png

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Elforat Pharma"
                  android:icon="@drawable/launcher_logo"
                  android:roundIcon="@drawable/launcher_logo"
                  android:usesCleartextTraffic="false"
                  android:resizeableActivity="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/elforatpharma/admin/MainActivity.java <<'EOF'
          package com.elforatpharma.admin;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          public class MainActivity extends Activity {
              private WebView webView;
              private FrameLayout root;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.setStatusBarColor(Color.TRANSPARENT);
                  window.setNavigationBarColor(Color.TRANSPARENT);
                  window.setNavigationBarDividerColor(Color.TRANSPARENT);

                  if (android.os.Build.VERSION.SDK_INT >= 30) {
                      window.setDecorFitsSystemWindows(false);
                  }

                  root = new FrameLayout(this);
                  root.setBackgroundColor(Color.WHITE);

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.WHITE);

                  FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                  );
                  root.addView(webView, params);
                  setContentView(root);

                  root.setOnApplyWindowInsetsListener((view, insets) -> {
                      int typeMask =
                              WindowInsets.Type.statusBars()
                                      | WindowInsets.Type.navigationBars()
                                      | WindowInsets.Type.displayCutout();

                      android.graphics.Insets systemInsets =
                              insets.getInsets(typeMask);

                      view.setPadding(
                              systemInsets.left,
                              systemInsets.top,
                              systemInsets.right,
                              systemInsets.bottom
                      );

                      return insets;
                  });

                  root.requestApplyInsets();

                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR |
                          View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                  );

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setLoadWithOverviewMode(false);
                  settings.setUseWideViewPort(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  CookieManager cookies = CookieManager.getInstance();
                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("https://elforatpharma.github.io/admin/");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#FFFFFF">
              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#FFFFFF" />
          </FrameLayout>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#4D3CEB</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

      - name: Build release APK
        working-directory: android-app
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -s android-app/app/build/outputs/apk/release/app-release.apk
          ls -lh android-app/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Elforat-Pharma-Admin-APK-v1.2.0
          path: android-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
