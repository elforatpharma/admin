          package com.elforatpharma.admin;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.net.Uri;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          public class ElforatFirebaseMessagingService extends FirebaseMessagingService {
              public static final String CHANNEL_ID = "orders_alerts_v2";
              public static final String PREFS = "elforat_admin";
              public static final String COUNT_KEY = "notification_count";

              @Override public void onMessageReceived(RemoteMessage message) {
                  String title = message.getData().get("title");
                  String body = message.getData().get("body");
                  String orderId = message.getData().get("order_id");
                  String confirmToken = message.getData().get("confirm_token");
                  String rejectToken = message.getData().get("reject_token");

                  if (title == null || title.isEmpty()) {
                      title = message.getNotification() != null && message.getNotification().getTitle() != null
                              ? message.getNotification().getTitle() : "الفرات فارما";
                  }
                  if (body == null || body.isEmpty()) {
                      body = message.getNotification() != null && message.getNotification().getBody() != null
                              ? message.getNotification().getBody() : "إشعار جديد";
                  }
                  if (orderId == null || orderId.isEmpty()) orderId = extractOrderId(body);

                  getSharedPreferences(PREFS, MODE_PRIVATE).edit()
                          .putInt(COUNT_KEY, getSharedPreferences(PREFS, MODE_PRIVATE).getInt(COUNT_KEY, 0) + 1)
                          .apply();

                  NotificationManager nm = getSystemService(NotificationManager.class);
                  createChannel(nm);

                  String target = "https://elforatpharma.github.io/admin/orders.html" +
                          (orderId == null || orderId.isEmpty() ? "" : "?order=" + Uri.encode(orderId));

                  Intent open = new Intent(this, MainActivity.class);
                  open.putExtra("deep_link_url", target);
                  open.setFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent pi = PendingIntent.getActivity(this, safeHash(orderId, 10), open,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  int notificationId = (int) (System.currentTimeMillis() & 0x7fffffff);
                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setSmallIcon(R.drawable.notification_logo)
                          .setColor(android.graphics.Color.rgb(212, 166, 42))
                          .setColorized(true)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setCategory(NotificationCompat.CATEGORY_MESSAGE)
                          .setNumber(getSharedPreferences(PREFS, MODE_PRIVATE).getInt(COUNT_KEY, 1))
                          .setAutoCancel(true)
                          .setContentIntent(pi);

                  if (orderId != null && !orderId.isEmpty()) {
                      Intent acknowledge = new Intent(this, NotificationActionReceiver.class);
                      acknowledge.setAction(NotificationActionReceiver.ACTION_ACKNOWLEDGE);
                      acknowledge.putExtra(NotificationActionReceiver.EXTRA_ORDER_ID, orderId);
                      acknowledge.putExtra(NotificationActionReceiver.EXTRA_TITLE, title);
                      acknowledge.putExtra(NotificationActionReceiver.EXTRA_BODY, body);
                      acknowledge.putExtra(NotificationActionReceiver.EXTRA_NOTIFICATION_ID, notificationId);
                      Intent snooze = new Intent(this, NotificationActionReceiver.class);
                      snooze.setAction(NotificationActionReceiver.ACTION_SNOOZE);
                      snooze.putExtra(NotificationActionReceiver.EXTRA_ORDER_ID, orderId);
                      snooze.putExtra(NotificationActionReceiver.EXTRA_TITLE, title);
                      snooze.putExtra(NotificationActionReceiver.EXTRA_BODY, body);
                      snooze.putExtra(NotificationActionReceiver.EXTRA_NOTIFICATION_ID, notificationId);
                      PendingIntent acknowledgePi = PendingIntent.getBroadcast(this, safeHash(orderId, 40), acknowledge, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      PendingIntent snoozePi = PendingIntent.getBroadcast(this, safeHash(orderId, 50), snooze, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      builder.addAction(new NotificationCompat.Action.Builder(android.R.drawable.ic_menu_view, "فتح الطلب", pi).build());
                      builder.addAction(new NotificationCompat.Action.Builder(android.R.drawable.ic_menu_send, "تأكيد الاستلام", acknowledgePi).build());
                      builder.addAction(new NotificationCompat.Action.Builder(android.R.drawable.ic_lock_idle_alarm, "تأجيل 15 دقيقة", snoozePi).build());
                  }
                  nm.notify(notificationId, builder.build());
              }

              private int safeHash(String value, int offset) {
                  return Math.abs((value == null ? "" : value).hashCode()) + offset;
              }

              private void createChannel(NotificationManager nm) {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(
                              CHANNEL_ID, "طلبات الفرات فارما", NotificationManager.IMPORTANCE_HIGH);
                      ch.setDescription("إشعارات الطلبات الجديدة وتغييراتها");
                      ch.enableVibration(true);
                      ch.setSound(
                              android.provider.Settings.System.DEFAULT_NOTIFICATION_URI,
                              new AudioAttributes.Builder()
                                      .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                                      .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                      .build());
                      nm.createNotificationChannel(ch);
                  }
              }

              private String extractOrderId(String body) {
                  try {
                      int hash = body.indexOf('#');
                      if (hash < 0) return "";
                      StringBuilder out = new StringBuilder();
                      for (int i = hash + 1; i < body.length(); i++) {
                          char ch = body.charAt(i);
                          if (Character.isLetterOrDigit(ch) || ch == '-') out.append(ch);
                          else break;
                      }
                      return out.toString();
                  } catch (Exception ignored) {
                      return "";
                  }
              }

              @Override public void onNewToken(String token) {
                  getSharedPreferences(PREFS, MODE_PRIVATE).edit().putString("fcm_token", token).apply();
                  com.google.firebase.messaging.FirebaseMessaging.getInstance().subscribeToTopic("admin_orders")
                          .addOnCompleteListener(task -> {
                              if (task.isSuccessful()) android.util.Log.i("ElforatFCM", "Topic subscription succeeded after token refresh");
                              else android.util.Log.e("ElforatFCM", "Topic subscription failed after token refresh", task.getException());
                          });
              }
          }
