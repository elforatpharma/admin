name: Build production Tailwind CSS

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "tailwind.config.cjs"
      - "src/tailwind.css"
      - ".github/workflows/build-tailwind-css.yml"
  workflow_dispatch:

concurrency:
  group: production-tailwind-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-tailwind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Tailwind CSS
        run: npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i ./src/tailwind.css -o ./tailwind.css --minify
      - name: Commit generated CSS safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebuild from the latest main on each attempt so concurrent dashboard
          # commits cannot leave generated CSS behind or cause a stale push.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i ./src/tailwind.css -o ./tailwind.css --minify

            if [ -z "$(git status --porcelain -- tailwind.css)" ]; then
              echo "No CSS changes."
              exit 0
            fi

            git add tailwind.css
            git commit -m "Build production Tailwind CSS"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another commit; retrying from latest main (attempt $attempt/3)."
            sleep "$((attempt * 2))"
          done

          echo "Unable to publish generated CSS after 3 attempts."
          exit 1