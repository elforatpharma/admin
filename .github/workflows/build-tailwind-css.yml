name: Build production Tailwind CSS

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "tailwind.config.cjs"
      - "src/tailwind.css"
      - ".github/workflows/build-tailwind-css.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tailwind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Tailwind CSS
        run: npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i ./src/tailwind.css -o ./tailwind.css --minify
      - name: Commit generated CSS
        run: |
          if [ -z "$(git status --porcelain -- tailwind.css)" ]; then
            echo "No CSS changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tailwind.css
          git commit -m "Build production Tailwind CSS"
          git push