<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="stylesheet" href="tailwind.css">
  <link rel="stylesheet" href="admin-responsive.css">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل دخول | الفرات فارما</title>
  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="apple-touch-icon" href="./logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background: linear-gradient(135deg, #faf8ff 0%, #ffffff 100%); }
        .font-display { font-family: 'Cairo', sans-serif; }
        .btn-brand-gradient{background:linear-gradient(90deg,#4d3ceb 0%,#8536ff 100%)!important;color:#ffffff!important;box-shadow:0 8px 20px rgba(77,60,235,0.3)!important;}
        .btn-brand-gradient:hover{background:linear-gradient(90deg,#3517d6 0%,#4d3ceb 100%)!important;box-shadow:0 10px 24px rgba(77,60,235,0.4)!important;}
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .float-animation { animation: float 3s ease-in-out infinite; }
        .fade-up { animation: fadeUp 0.8s ease-out forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 overflow-hidden">
    <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
        <div class="absolute top-[-10%] right-[-10%] size-96 bg-primary/5 rounded-full blur-3xl"></div>
        <div class="absolute bottom-[-10%] left-[-10%] size-96 bg-primary/5 rounded-full blur-3xl"></div>
    </div>

    <div class="bg-white/80 backdrop-blur-xl p-8 md:p-12 rounded-[40px] shadow-[0_20px_50px_rgba(0,0,0,0.05)] w-full max-w-md border border-white/50 text-center space-y-8 z-10 fade-up">
        <div class="space-y-4">
            <div class="inline-flex items-center justify-center bg-transparent ">
                <img src="logo.png" alt="الفرات فارما" class="h-20 w-auto object-contain bg-transparent mix-blend-multiply float-animation" style="mix-blend-mode:multiply;" />
            </div>
            <div class="fade-up delay-1">
                <h1 class="font-display text-2xl font-black text-slate-800">لوحة التحكم</h1>
                <p class="text-sm text-slate-500 font-medium">أهلاً بك مجدداً في الفرات فارما</p>
            </div>
        </div>

        <form id="login-form" class="space-y-5 fade-up delay-2">
            <div class="relative group">
                <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[#4d3ceb] transition-colors">lock</span>
                <input type="password" id="password" placeholder="أدخل كلمة المرور"
                    class="w-full p-5 pr-12 pl-14 bg-slate-50 border-2 border-transparent rounded-[24px] text-right font-bold focus:bg-white focus:border-[#4d3ceb]/20 focus:ring-4 focus:ring-[#4d3ceb]/5 outline-none transition-all placeholder:text-slate-300 placeholder:font-medium"
                    required>
                <button type="button" id="toggle-password" aria-label="إظهار كلمة المرور"
                    class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-[#4d3ceb] transition-colors flex items-center justify-center"
                    title="إظهار كلمة المرور">
                    <span class="material-symbols-outlined text-[22px]">visibility</span>
                </button>
            </div>

            <div class="text-left">
                <button type="button" id="forgot-btn" class="text-sm font-bold text-slate-500 hover:text-[#4d3ceb] transition-colors">نسيت كلمة المرور؟</button>
            </div>

            <button type="submit" id="submit-btn"
                class="w-full btn-brand-gradient py-5 rounded-[24px] font-black text-lg hover:scale-[1.01] active:scale-[0.98] transition-all flex items-center justify-center gap-2 group">
                <span>دخول الآدمن</span>
                <svg class="size-5 group-hover:translate-x-[-4px] transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
                </svg>
            </button>
        </form>

        <p id="error-msg" class="text-sm text-red-500 font-bold hidden flex items-center justify-center gap-2">
            <span>❌</span>
            <span>عذراً، كلمة المرور غير صحيحة</span>
        </p>

        <div class="pt-4 border-t border-slate-100">
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Elforat Pharma Security System</p>
        </div>
    </div>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="supabaseClient.js"></script>
    <script>
        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');
        const submitBtn = document.getElementById('submit-btn');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('toggle-password');
        const toggleIcon = togglePassword.querySelector('.material-symbols-outlined');
        const adminEmail = ADMIN_EMAIL;

        togglePassword.onclick = () => {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            toggleIcon.textContent = isHidden ? 'visibility_off' : 'visibility';
            togglePassword.setAttribute('aria-label', isHidden ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
            togglePassword.title = isHidden ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور';
        };

        function showLoginError() {
            errorMsg.classList.remove('hidden');
            loginForm.classList.add('animate-shake');
            setTimeout(() => loginForm.classList.remove('animate-shake'), 500);
        }

        loginForm.onsubmit = async (e) => {
            e.preventDefault();
            const password = passwordInput.value;

            submitBtn.innerHTML = '<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018 8V0C5.373 0 0 5.373 0 12h4z"></path></svg><span>جاري التحقق...</span>';
            submitBtn.disabled = true;
            errorMsg.classList.add('hidden');

            try {
                const { data, error } = await _supabase.auth.signInWithPassword({
                    email: adminEmail,
                    password: password,
                });

                if (error) throw error;

                if (!isAdminUser(data.user)) {
                    await _supabase.auth.signOut();
                    errorMsg.querySelector('span:last-child').textContent = 'عفواً، هذا الحساب غير مصرح له بالدخول';
                    showLoginError();
                    return;
                }

                window.location.href = 'admin.html';
            } catch (error) {
                console.error("Login Error:", error.message);
                errorMsg.querySelector('span:last-child').textContent = 'عذراً، كلمة المرور غير صحيحة';
                showLoginError();
            } finally {
                submitBtn.innerHTML = '<span>دخول الآدمن</span><svg class="size-5 group-hover:translate-x-[-4px] transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" /></svg>';
                submitBtn.disabled = false;
            }
        };

        document.getElementById('forgot-btn').onclick = async () => {
            const btn = document.getElementById('forgot-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'جاري الإرسال...';
            btn.disabled = true;

            try {
                const { error } = await _supabase.auth.resetPasswordForEmail('ahmedsalamaahmed21@gmail.com', {
                    redirectTo: 'https://elforatpharma.github.io/admin/update-password.html',
                });
                if (error) throw error;
                alert('تم إرسال رابط استعادة كلمة المرور إلى ahmedsalamaahmed21@gmail.com');
            } catch (error) {
                console.error("Reset Error:", error.message);
                alert('حدث خطأ أثناء الإرسال. تأكد من إعدادات البريد.');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        };
    </script>

    <style>
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .animate-shake { animation: shake 0.2s ease-in-out 0s 2; }
    </style>

<script>
/* Keep Material Symbols ligature names hidden on the login screen until the icon font is ready. */
(function(){
  function markMaterialSymbolsReady(){
    if(!document.fonts || !document.fonts.load){document.documentElement.classList.add('material-symbols-ready');return;}
    document.fonts.load('24px "Material Symbols Outlined"').then(function(){
      document.documentElement.classList.add('material-symbols-ready');
    }).catch(function(){});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',markMaterialSymbolsReady,{once:true});
  else markMaterialSymbolsReady();
})();
</script>
</body>
</html>
