<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>المخزون - الفرات فارما</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{primary:"#ec135b"},fontFamily:{display:["Tajawal","sans-serif"]}}}};</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <style>
    body{font-family:'Tajawal',sans-serif;background:#f8f9fb;}
    .material-symbols-outlined{font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;}
    ::-webkit-scrollbar{width:5px;} ::-webkit-scrollbar-track{background:transparent;} ::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:10px;}
    .nav-active{background:linear-gradient(135deg,rgba(236,19,91,.08),rgba(236,19,91,.04));color:#ec135b;border-right:3px solid #ec135b;}
  </style>
</head>
<body class="text-gray-900 antialiased min-h-screen">
<div class="flex h-screen overflow-hidden">

  <!-- Sidebar (يتم إنشاؤه من layout.js) -->
  <div id="sidebar-placeholder"></div>

  <!-- Main -->
  <main class="flex-1 lg:mr-64 overflow-y-auto">
    <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-gray-100 px-8 py-4 flex items-center justify-between">
      <div>
        <h2 class="text-xl font-black text-gray-900 tracking-tight">إدارة المنتجات</h2>
        <p class="text-xs text-gray-400 font-medium mt-0.5">التحكم في مخزون وأسعار المنتجات</p>
      </div>
      <a href="admin.html" class="flex items-center gap-2 bg-primary text-white px-5 py-2.5 rounded-xl text-sm font-bold hover:bg-primary/90 shadow-lg shadow-primary/20 transition-all">
        <span class="material-symbols-outlined text-[18px]">add</span>إضافة منتج
      </a>
    </header>

    <div class="p-8 max-w-[1400px] mx-auto space-y-6">

      <!-- Stats -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
          <p class="text-[10px] text-gray-400 font-black uppercase tracking-wider mb-1">إجمالي المنتجات</p>
          <h3 id="stat-total-products" class="text-3xl font-black text-gray-900">0</h3>
        </div>
        <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
          <p class="text-[10px] text-gray-400 font-black uppercase tracking-wider mb-1">الأقسام النشطة</p>
          <h3 id="stat-categories" class="text-3xl font-black text-gray-900">0</h3>
        </div>
      </div>

      <!-- Table -->
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
        <div class="overflow-x-auto min-h-[400px]">
          <table class="w-full text-right">
            <thead>
              <tr class="text-[10px] font-black uppercase tracking-widest text-gray-400" style="background:rgba(248,249,251,.8)">
                <th class="px-6 py-4 text-center w-20">ترتيب</th>
                <th class="px-6 py-4">المنتج</th>
                <th class="px-6 py-4">القسم</th>
                <th class="px-6 py-4 text-center">السعر</th>
                <th class="px-6 py-4 text-center">الإجراءات</th>
              </tr>
            </thead>
            <tbody id="inventory-body" class="divide-y divide-gray-50">
              <tr><td colspan="5" class="text-center py-16 text-gray-300 animate-pulse font-bold">جاري تحميل المخزون...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Edit Modal -->
<div id="edit-modal" class="fixed inset-0 bg-black/30 backdrop-blur-sm hidden items-center justify-center z-[100] p-4">
  <div class="bg-white rounded-3xl p-8 w-full max-w-xl shadow-2xl border border-gray-100 overflow-y-auto max-h-[90vh]">
    <div class="flex items-center justify-between mb-8">
      <h2 class="text-xl font-black text-gray-900">تعديل بيانات المنتج</h2>
      <button onclick="closeEditModal()" class="text-gray-300 hover:text-red-500 transition-colors p-1 rounded-lg hover:bg-red-50"><span class="material-symbols-outlined">close</span></button>
    </div>
    <form id="edit-form" onsubmit="submitEditForm(event)" class="space-y-5">
      <input type="hidden" id="edit-id">
      <div class="space-y-1.5"><label class="text-[10px] font-black text-gray-400 uppercase tracking-wider">اسم المنتج</label>
        <input type="text" id="edit-name" name="name" class="w-full p-4 bg-gray-50 rounded-2xl border border-gray-200 outline-none focus:border-primary focus:bg-white transition-all font-bold" required></div>
      <div class="grid grid-cols-2 gap-4">
        <div class="space-y-1.5"><label class="text-[10px] font-black text-gray-400 uppercase tracking-wider">السعر الحالي</label>
          <input type="number" id="edit-price" name="price" class="w-full p-4 bg-gray-50 rounded-2xl border border-gray-200 outline-none focus:border-primary focus:bg-white transition-all font-bold" required></div>
        <div class="space-y-1.5"><label class="text-[10px] font-black text-gray-400 uppercase tracking-wider">السعر القديم</label>
          <input type="number" id="edit-oldPrice" name="oldPrice" class="w-full p-4 bg-gray-50 rounded-2xl border border-gray-200 outline-none focus:border-primary focus:bg-white transition-all font-bold"></div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div class="space-y-1.5"><label class="text-[10px] font-black text-gray-400 uppercase tracking-wider">القسم</label>
          <select id="edit-category" name="category" class="w-full p-4 bg-gray-50 rounded-2xl border border-gray-200 outline-none focus:border-primary focus:bg-white transition-all font-bold">
            <option value="العناية بالبشرة">العناية بالبشرة</option><option value="العناية بالشعر">العناية بالشعر</option>
            <option value="مستحضرات تجميل">مستحضرات تجميل</option><option value="مجموعات متكاملة">مجموعات متكاملة</option>
          </select></div>
        <div class="space-y-1.5"><label class="text-[10px] font-black text-gray-400 uppercase tracking-wider">Badge</label>
          <input type="text" id="edit-badge" name="badge" placeholder="مثال: جديد ✨" class="w-full p-4 bg-gray-50 rounded-2xl border border-gray-200 outline-none focus:border-primary focus:bg-white transition-all font-bold"></div>
      </div>
      <div class="space-y-1.5"><label class="text-[10px] font-black text-gray-400 uppercase tracking-wider">تحديث الصورة</label>
        <input type="file" name="image" class="w-full text-sm text-gray-400 file:mr-4 file:py-3 file:px-5 file:rounded-xl file:border-0 file:font-bold file:text-primary cursor-pointer bg-gray-50 rounded-2xl border border-gray-200 p-2"></div>
      <div class="pt-4 flex gap-3">
        <button type="submit" class="flex-1 bg-primary text-white py-4 rounded-2xl font-black shadow-xl shadow-primary/20 hover:bg-primary/90 transition-all">حفظ التغييرات</button>
        <button type="button" onclick="closeEditModal()" class="px-8 bg-gray-100 text-gray-500 py-4 rounded-2xl font-bold hover:bg-gray-200 transition-all">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<script src="layout.js"></script>
<script>
let products=[];

async function load(){
  const tbody=document.getElementById('inventory-body');
  try{
    const{data,error}=await _supabase.from('products').select('*').order('priority',{ascending:false});
    if(error) throw error;
    products=data||[];updateStats();render();
  }catch(e){
    tbody.innerHTML=`<tr><td colspan="5" class="text-center py-16 text-red-400 font-bold">فشل جلب بيانات المخزون.</td></tr>`;
  }
}

function updateStats(){
  document.getElementById('stat-total-products').innerText=products.length;
  document.getElementById('stat-categories').innerText=[...new Set(products.map(p=>p.category))].length;
}

function render(){
  const tbody=document.getElementById('inventory-body');
  if(products.length===0){tbody.innerHTML=`<tr><td colspan="5" class="text-center py-16 text-gray-300 font-bold">المخزون فارغ تماماً حالياً</td></tr>`;return;}
  tbody.innerHTML=products.map((p,i)=>{
    const pid=escapeHtml(String(p.id));
    const name=escapeHtml(p.name)||'منتج';
    const cat=escapeHtml(p.category)||'-';
    const badge=escapeHtml(p.badge);
    const img=p.img?escapeHtml(p.img):'logo.png';
    const price=escapeHtml(p.price)||0;
    const oldPrice=p.oldPrice?escapeHtml(p.oldPrice):'';
    return `
    <tr class="hover:bg-gray-50/50 transition-colors">
      <td class="px-6 py-4">
        <div class="flex flex-col gap-1 items-center">
          <button onclick="move(${i},-1)" class="${i===0?'invisible':''} size-7 flex items-center justify-center rounded-lg bg-gray-100 hover:bg-primary hover:text-white transition-all text-gray-400">
            <span class="material-symbols-outlined text-[18px]">expand_less</span></button>
          <button onclick="move(${i},1)" class="${i===products.length-1?'invisible':''} size-7 flex items-center justify-center rounded-lg bg-gray-100 hover:bg-primary hover:text-white transition-all text-gray-400">
            <span class="material-symbols-outlined text-[18px]">expand_more</span></button>
        </div>
      </td>
      <td class="px-6 py-4">
        <div class="flex items-center gap-4">
          <div class="size-14 rounded-2xl bg-white border border-gray-100 p-1 shrink-0 shadow-sm relative">
            <img src="${img}" alt="${name}" class="w-full h-full object-contain mix-blend-multiply" onerror="this.src='logo.png'">
            ${badge?`<span class="absolute -top-2 -right-2 bg-primary text-[8px] text-white px-1.5 py-0.5 rounded-full font-black shadow-lg shadow-primary/30">${badge}</span>`:''}
          </div>
          <span class="font-bold text-sm text-gray-900">${name}</span>
        </div>
      </td>
      <td class="px-6 py-4">
        <span class="text-[10px] font-black px-3 py-1 rounded-full bg-gray-100 text-gray-500 uppercase tracking-wider">${cat}</span>
      </td>
      <td class="px-6 py-4 text-center">
        <span class="font-black text-primary text-sm">${price} ج.م</span>
        ${oldPrice?`<span class="block text-[10px] text-gray-400 line-through">${oldPrice} ج.م</span>`:''}
      </td>
      <td class="px-6 py-4">
        <div class="flex gap-2 justify-center">
          <button onclick="openEdit('${pid}')" class="size-9 rounded-xl bg-blue-50 text-blue-500 hover:bg-blue-600 hover:text-white flex items-center justify-center transition-all shadow-sm">
            <span class="material-symbols-outlined text-[18px]">edit</span></button>
          <button onclick="del('${pid}','${name.replace(/'/g,"&#039;")}')" class="size-9 rounded-xl bg-red-50 text-red-500 hover:bg-red-600 hover:text-white flex items-center justify-center transition-all shadow-sm">
            <span class="material-symbols-outlined text-[18px]">delete</span></button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function openEdit(id){
  const p=products.find(x=>x.id===id);
  document.getElementById('edit-id').value=p.id;document.getElementById('edit-name').value=p.name;
  document.getElementById('edit-price').value=p.price;document.getElementById('edit-oldPrice').value=p.oldPrice||'';
  document.getElementById('edit-category').value=p.category;document.getElementById('edit-badge').value=p.badge||'';
  const modal=document.getElementById('edit-modal');modal.classList.remove('hidden');modal.classList.add('flex');
}
function closeEditModal(){const m=document.getElementById('edit-modal');m.classList.add('hidden');m.classList.remove('flex');}

async function submitEditForm(e){
  e.preventDefault();const btn=e.target.querySelector('button[type="submit"]');
  const old=btn.innerText;btn.innerText="جاري الحفظ...";btn.disabled=true;
  const id=document.getElementById('edit-id').value;const file=e.target.image.files[0];
  let updateData={name:document.getElementById('edit-name').value,price:Number(document.getElementById('edit-price').value),oldPrice:document.getElementById('edit-oldPrice').value?Number(document.getElementById('edit-oldPrice').value):null,category:document.getElementById('edit-category').value,badge:document.getElementById('edit-badge').value};
  const existing=products.find(x=>x.id===id);
  try{
    if(file){const fn=sanitizeFileName(file.name);const{error:upErr}=await _supabase.storage.from('products').upload(`uploads/${fn}`,file);if(upErr)throw upErr;const{data:{publicUrl}}=_supabase.storage.from('products').getPublicUrl(`uploads/${fn}`);updateData.img=publicUrl;}
    const{error}=await _supabase.from('products').update(updateData).eq('id',id);
    if(error) throw error;
    // حذف الصورة القديمة عند استبدالها
    if(file&&existing&&existing.img) deleteStorageFile(existing.img);
    closeEditModal();await load();Swal.fire({title:'تم التحديث!',icon:'success',confirmButtonColor:'#ec135b'});
  }catch(err){Swal.fire({title:'خطأ في التحديث',icon:'error',confirmButtonColor:'#ec135b'});}
  finally{btn.innerText=old;btn.disabled=false;}
}

async function del(id,name){
  const r=await Swal.fire({title:'هل أنت متأكد؟',text:`سيتم حذف "${name}" نهائياً!`,icon:'warning',showCancelButton:true,confirmButtonColor:'#ec135b',cancelButtonColor:'#e5e7eb',confirmButtonText:'نعم، احذفه',cancelButtonText:'إلغاء'});
  if(r.isConfirmed){
    try{
      const target=products.find(x=>x.id===id);
      const{error}=await _supabase.from('products').delete().eq('id',id);
      if(error)throw error;
      // حذف صورة المنتج من التخزين إن وجدت
      if(target&&target.img) deleteStorageFile(target.img);
      await load();Swal.fire({title:'تم الحذف!',icon:'success',confirmButtonColor:'#ec135b'});
    }catch(e){Swal.fire({title:'فشل في الحذف',icon:'error',confirmButtonColor:'#ec135b'});}
  }
}

async function move(i,dir){
  const ti=i+dir;if(ti<0||ti>=products.length)return;
  const newOrder=products.slice();
  [newOrder[i],newOrder[ti]]=[newOrder[ti],newOrder[i]];
  // إعادة كتابة الأولويات حسب الترتيب الجديد لضمان ثبات التصحيح
  try{
    await Promise.all(newOrder.map((p,idx)=>_supabase.from('products').update({priority:idx}).eq('id',p.id)));
    await load();
  }catch(err){console.error(err);}
}

window.onload=async function(){
  renderSidebar('inventory.html');
  const ok=await requireAdmin();
  if(ok) load();
};
</script>
</body>
</html>
