<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>إدارة الطلبات - الفرات فارما</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{primary:"#ec135b"},fontFamily:{display:["Tajawal","sans-serif"]}}}};</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <style>
    body{font-family:'Tajawal',sans-serif;background:#f8f9fb;}
    .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
    ::-webkit-scrollbar{width:5px;} ::-webkit-scrollbar-track{background:transparent;} ::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:10px;}
    .nav-active{background:linear-gradient(135deg,rgba(236,19,91,.08),rgba(236,19,91,.04));color:#ec135b;border-right:3px solid #ec135b;}
  </style>
</head>
<body class="text-gray-900 antialiased min-h-screen">
<div class="flex h-screen overflow-hidden">

  <!-- Sidebar (يتم إنشاؤه من layout.js) -->
  <div id="sidebar-placeholder"></div>

  <!-- Main -->
  <main class="flex-1 lg:mr-64 overflow-y-auto">
    <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-gray-100 px-8 py-4 flex items-center justify-between">
      <div>
        <h2 class="text-xl font-black text-gray-900 tracking-tight">إدارة الطلبات</h2>
        <p class="text-xs text-gray-400 font-medium mt-0.5">متابعة وتحديث طلبات العملاء</p>
      </div>
      <button onclick="fetchOrders()" class="flex items-center gap-2 bg-primary text-white px-5 py-2.5 rounded-xl text-sm font-bold hover:bg-primary/90 shadow-lg shadow-primary/20 transition-all">
        <span class="material-symbols-outlined text-[18px]">refresh</span>تحديث
      </button>
    </header>

    <div class="p-8 space-y-6 max-w-[1400px] mx-auto">

      <!-- Stats row -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
          <p class="text-[10px] text-gray-400 font-black uppercase tracking-wider mb-1">الأرباح الفعلية (تم التوصيل)</p>
          <h3 id="stat-revenue" class="text-3xl font-black text-gray-900">0 <small class="text-sm font-medium text-gray-400">ج.م</small></h3>
        </div>
        <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
          <p class="text-[10px] text-gray-400 font-black uppercase tracking-wider mb-1">إجمالي عدد الطلبات</p>
          <h3 id="stat-count" class="text-3xl font-black text-gray-900">0</h3>
        </div>
      </div>

      <!-- Orders Table Card -->
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
        <!-- Tabs -->
        <div class="flex border-b border-gray-100 px-6 gap-6 overflow-x-auto">
          <button onclick="renderOrders('الكل')" id="tab-all" class="flex items-center gap-2 border-b-2 border-primary text-primary pb-4 pt-5 whitespace-nowrap transition-all">
            <span class="text-sm font-black">الكل</span>
            <span id="count-all" class="text-[10px] px-2 py-0.5 rounded-full font-black" style="background:rgba(236,19,91,.1);color:#ec135b">0</span>
          </button>
          <button onclick="renderOrders('قيد التنفيذ')" id="tab-pending" class="flex items-center gap-2 border-b-2 border-transparent text-gray-400 pb-4 pt-5 whitespace-nowrap transition-all">
            <span class="text-sm font-bold">قيد التنفيذ</span>
            <span id="count-pending" class="bg-amber-50 text-amber-600 text-[10px] px-2 py-0.5 rounded-full font-black">0</span>
          </button>
          <button onclick="renderOrders('تم التوصيل')" id="tab-delivered" class="flex items-center gap-2 border-b-2 border-transparent text-gray-400 pb-4 pt-5 whitespace-nowrap transition-all">
            <span class="text-sm font-bold">تم التوصيل</span>
            <span id="count-delivered" class="bg-emerald-50 text-emerald-600 text-[10px] px-2 py-0.5 rounded-full font-black">0</span>
          </button>
        </div>

        <div class="overflow-x-auto min-h-[400px]">
          <table class="w-full text-right">
            <thead>
              <tr class="text-[10px] font-black uppercase tracking-widest text-gray-400" style="background:rgba(248,249,251,.8)">
                <th class="px-6 py-4">معرف الطلب</th><th class="px-6 py-4">العميل</th><th class="px-6 py-4">الهاتف</th>
                <th class="px-6 py-4">المنتجات</th><th class="px-6 py-4">التاريخ</th><th class="px-6 py-4">الإجمالي</th>
                <th class="px-6 py-4">الحالة</th><th class="px-6 py-4 text-center">إجراءات</th>
              </tr>
            </thead>
            <tbody id="orders-table-body" class="divide-y divide-gray-50">
              <tr><td colspan="8" class="text-center py-12 text-gray-300 animate-pulse">جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="layout.js"></script>
<script>
let allOrders=[],currentFilter='الكل';

async function fetchOrders(){
  try{
    const{data,error}=await _supabase.from('orders').select('*').order('created_at',{ascending:false});
    if(error) throw error;
    allOrders=data;renderOrders(currentFilter);
  }catch(error){
    document.getElementById('orders-table-body').innerHTML=`<tr><td colspan="8" class="text-center py-16 text-red-400 font-bold">فشل جلب الطلبات.</td></tr>`;
  }
}

async function deleteOrder(id){
  const result=await Swal.fire({title:'هل أنت متأكد؟',text:"سيتم حذف هذا الطلب نهائياً!",icon:'warning',showCancelButton:true,confirmButtonColor:'#ec135b',confirmButtonText:'نعم، احذفه',cancelButtonText:'إلغاء'});
  if(result.isConfirmed){
    try{
      const{error}=await _supabase.from('orders').delete().eq('id',id);
      if(!error){allOrders=allOrders.filter(o=>o.id!==id);renderOrders(currentFilter);Swal.fire({title:'تم الحذف!',icon:'success',confirmButtonColor:'#ec135b'});}
    }catch(e){Swal.fire('خطأ!','فشل الحذف','error');}
  }
}

async function updateStatus(id,newStatus){
  try{
    const{error}=await _supabase.from('orders').update({status:newStatus}).eq('id',id);
    if(!error){const i=allOrders.findIndex(o=>o.id===id);if(i!==-1){allOrders[i].status=newStatus;renderOrders(currentFilter);}}
  }catch(e){console.error(e);}
}

function getStatusStyle(status){
  const s=(status||'قيد التنفيذ').trim();
  if(s==='تم التوصيل') return 'bg-emerald-50 text-emerald-700 border-emerald-200';
  if(s==='ملغي') return 'bg-red-50 text-red-600 border-red-200';
  return 'bg-amber-50 text-amber-700 border-amber-200';
}

function renderOrders(filter){
  currentFilter=filter;
  document.querySelectorAll('[id^="tab-"]').forEach(btn=>{btn.classList.remove('border-primary','text-primary');btn.classList.add('border-transparent','text-gray-400');});
  const activeTabId=filter==='الكل'?'tab-all':(filter==='قيد التنفيذ'?'tab-pending':'tab-delivered');
  const activeTab=document.getElementById(activeTabId);
  activeTab.classList.add('border-primary','text-primary');activeTab.classList.remove('border-transparent','text-gray-400');

  let pending=0,delivered=0,deliveredRev=0;
  allOrders.forEach(o=>{
    const s=(o.status||'قيد التنفيذ').trim();
    if(s==='تم التوصيل'){delivered++;deliveredRev+=parseFloat(o.total)||0;}
    else if(s==='قيد التنفيذ')pending++;
  });

  document.getElementById('count-all').innerText=allOrders.length;
  document.getElementById('count-pending').innerText=pending;
  document.getElementById('count-delivered').innerText=delivered;
  document.getElementById('stat-revenue').innerHTML=`${deliveredRev} <small class="text-sm font-medium text-gray-400">ج.م</small>`;
  document.getElementById('stat-count').innerText=allOrders.length;

  const filtered=filter==='الكل'?allOrders:allOrders.filter(o=>(o.status||'قيد التنفيذ').trim()===filter);
  const tbody=document.getElementById('orders-table-body');

  if(filtered.length===0){tbody.innerHTML=`<tr><td colspan="8" class="text-center py-16 text-gray-300">لا توجد طلبات حالياً</td></tr>`;return;}

  tbody.innerHTML=filtered.map(o=>{
    const id=escapeHtml(String(o.id));
    const name=escapeHtml(o.customerName)||'عميل';
    const phone=escapeHtml(o.phone)||'-';
    const total=escapeHtml(o.total)||0;
    const date=escapeHtml(o.date)||'-';
    const curStatus=(o.status||'قيد التنفيذ').trim();
    const itemsHtml=Array.isArray(o.items)&&o.items.length>0
      ? o.items.map(item=>`
        <div class="flex items-center gap-1.5 mb-1">
          <span class="inline-flex items-center justify-center text-[9px] font-black rounded-full w-4 h-4 shrink-0 text-primary" style="background:rgba(236,19,91,.1)">${escapeHtml(String(item.qty||1))}</span>
          <span class="text-[10px] font-bold text-gray-700 truncate max-w-[160px]">${escapeHtml(item.name)||'-'}</span>
          ${item.isGift?'<span class="text-[9px] text-emerald-500 font-black">🎁</span>':''}
        </div>`).join('')
      : '<span class="text-[10px] text-gray-300">—</span>';
    return `
    <tr class="hover:bg-gray-50/50 transition-colors">
      <td class="px-6 py-4 font-mono text-xs font-black text-primary">#${id}</td>
      <td class="px-6 py-4 font-bold text-sm">${name}</td>
      <td class="px-6 py-4 text-xs text-gray-500" dir="ltr">${phone}</td>
      <td class="px-6 py-4 max-w-[200px]">${itemsHtml}</td>
      <td class="px-6 py-4 text-[10px] text-gray-400">${date}</td>
      <td class="px-6 py-4 font-black text-sm">${total} ج.م</td>
      <td class="px-6 py-4">
        <select onchange="updateStatus('${id}',this.value)" class="text-[10px] font-bold rounded-lg px-2 py-1.5 border outline-none cursor-pointer ${getStatusStyle(o.status)}">
          <option value="قيد التنفيذ" ${curStatus==='قيد التنفيذ'?'selected':''}>⏳ قيد التنفيذ</option>
          <option value="تم التوصيل" ${curStatus==='تم التوصيل'?'selected':''}>✅ تم التوصيل</option>
          <option value="ملغي" ${curStatus==='ملغي'?'selected':''}>❌ ملغي</option>
        </select>
      </td>
      <td class="px-6 py-4 text-center">
        <button onclick="deleteOrder('${id}')" class="size-8 rounded-xl flex items-center justify-center text-gray-300 hover:bg-red-50 hover:text-red-500 transition-all mx-auto">
          <span class="material-symbols-outlined text-[18px]">delete</span>
        </button>
      </td>
    </tr>`;
  }).join('');
}

window.onload=async function(){
  renderSidebar('orders.html');
  const ok=await requireAdmin();
  if(ok) fetchOrders();
};
</script>
</body>
</html>
