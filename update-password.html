<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تعيين كلمة مرور جديدة | الفرات فارما</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f8f9fb; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md text-center">
        <h2 class="text-2xl font-black text-slate-800 mb-2">كلمة مرور جديدة</h2>
        <p class="text-sm text-slate-500 mb-6">قم بإدخال كلمة المرور الجديدة لحسابك</p>

        <form id="update-password-form" class="space-y-4">
            <input type="password" id="new-password" placeholder="كلمة المرور الجديدة"
                class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl text-right font-bold focus:bg-white focus:border-[#ec135b] outline-none" required>
            
            <button type="submit" id="update-btn"
                class="w-full bg-[#ec135b] text-white py-4 rounded-xl font-black text-lg shadow-md hover:bg-[#d01150] transition-all">
                تحديث كلمة المرور
            </button>
        </form>
        <p id="msg" class="text-sm font-bold mt-4 hidden"></p>
    </div>

    <script>
        const supabaseUrl = 'https://sidtdxchiqiogfkwbdui.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpZHRkeGNoaXFpb2dma3diZHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxMTEyMTAsImV4cCI6MjA4OTY4NzIxMH0.QF1-67Qu2HfWJt3ANSegM87fykOYQBwqC7ggLG8LTVU';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // Supabase will automatically parse the access token from the URL hash
        
        document.getElementById('update-password-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('update-btn');
            const msg = document.getElementById('msg');
            const newPassword = document.getElementById('new-password').value;

            btn.disabled = true;
            btn.innerHTML = 'جاري التحديث...';

            try {
                const { error } = await _supabase.auth.updateUser({ password: newPassword });
                if (error) throw error;

                msg.className = "text-sm font-bold mt-4 text-emerald-600";
                msg.innerHTML = "✅ تم تحديث كلمة المرور بنجاح! سيتم تحويلك...";
                msg.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 2000);

            } catch (error) {
                console.error(error);
                msg.className = "text-sm font-bold mt-4 text-red-500";
                msg.innerHTML = "❌ حدث خطأ: " + error.message;
                msg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = 'تحديث كلمة المرور';
            }
        };
    </script>
</body>
</html>
