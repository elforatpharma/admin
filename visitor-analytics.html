<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تحليلات الزيارات - الفرات فارما</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <style>
    body{font-family:'Tajawal',sans-serif;background:#faf8ff;color:#131b2e}
    .material-symbols-outlined{font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24}
    .efp-header{background:rgba(255,255,255,.92);border-bottom:1px solid #e2e8f0;backdrop-filter:blur(14px)}
    .efp-panel{background:#fff;border:1px solid #e2e8f0;border-radius:24px;box-shadow:0 8px 30px rgba(51,18,213,.045)}
    .efp-btn{background:linear-gradient(90deg,#4d3ceb 0%,#8536ff 100%);color:#fff;box-shadow:0 8px 20px rgba(77,60,235,.3)}
    @media(max-width:1023.98px){main{padding-bottom:80px!important}.efp-panel{border-radius:20px}}
  
/* Inventory UI parity — layout + spacing + rounded edges only */
html,body{background:#f8fafc!important}
body{min-width:0;overflow-x:hidden}
main{min-width:0!important;padding-top:0!important;padding-bottom:80px!important;width:100%!important;box-sizing:border-box;flex:1 1 auto}
main>.max-w-7xl{width:100%!important;max-width:1400px!important;margin:0 auto!important;padding:24px!important;box-sizing:border-box}
.efp-header{position:sticky!important;top:0!important;margin:0 0 20px!important;border:1px solid #eef0ff!important;border-radius:20px!important;background:rgba(255,255,255,.96)!important;box-shadow:0 2px 10px rgba(15,23,42,.035)!important;padding:18px 22px!important}
.efp-header h1{font-family:'Cairo',sans-serif!important;font-size:22px!important;line-height:1.35!important}
.efp-header p{line-height:1.5!important}
.efp-btn{border-radius:12px!important;min-height:40px!important}
.efp-panel{border:1px solid #eef0ff!important;border-radius:24px!important;background:#fff!important;box-shadow:0 2px 10px rgba(15,23,42,.035)!important;padding:24px!important}
.efp-panel h2{font-family:'Cairo',sans-serif!important;font-size:16px!important}
#kpis{gap:16px!important}
#kpis>div{min-height:150px!important;padding:24px!important;border-radius:24px!important;border:1px solid #eef0ff!important;background:#fff!important;box-shadow:0 2px 10px rgba(15,23,42,.035)!important;transition:transform .18s ease,box-shadow .18s ease!important}
#kpis>div:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,23,42,.07)!important;border-color:#ddd6fe!important}
#kpis>div p{font-family:'Cairo',sans-serif!important}
@media(min-width:1024px){
  /* Sidebar is fixed on the right; reserve its 256px exactly like Inventory */
  main{padding-right:256px!important;padding-left:0!important}
}
@media(max-width:1023.98px){
  main{padding-right:0!important}
  main>.max-w-7xl{padding:16px!important}
  .efp-header{border-radius:20px!important;padding:16px!important;margin-bottom:16px!important}
  .efp-panel{border-radius:20px!important;padding:18px!important}
  #kpis{gap:12px!important}
  #kpis>div{min-height:132px!important;padding:16px!important;border-radius:20px!important}
}
@media(max-width:420px){
  main>.max-w-7xl{padding:12px!important}
  .efp-header{padding:14px!important;border-radius:18px!important}
  .efp-header h1{font-size:19px!important}
  .efp-header p{font-size:11px!important}
  .efp-btn{padding-left:12px!important;padding-right:12px!important}
  .efp-panel{padding:14px!important;border-radius:18px!important}
  #kpis{gap:10px!important}
  #kpis>div{min-height:124px!important;padding:14px!important;border-radius:18px!important}
  #kpis>div .text-2xl{font-size:21px!important}
}

</style>
</head>
<body>
<div class="flex min-h-screen">
  <div id="sidebar-placeholder"></div>
  <main class="pr-0 lg:pr-64 flex-1 p-3 sm:p-6">
    <div class="max-w-7xl mx-auto space-y-5">
      <div class="efp-header sticky top-0 z-30 -mx-3 sm:-mx-6 px-3 sm:px-6 py-4 flex items-center justify-between gap-3 mb-5">
        <div>
          <h1 class="font-[Cairo] text-2xl font-bold">تحليلات الزيارات والفانل</h1>
          <p class="text-sm text-[#64748b] mt-1">مصادر الزيارات، أحداث المتجر، أداء المنتجات، وربط الجلسات بالطلبات.</p>
        </div>
        <button onclick="loadAnalytics()" class="efp-btn h-10 px-5 rounded-full font-bold inline-flex items-center gap-2 transition-all"><span class="material-symbols-outlined text-lg">refresh</span>تحديث</button>
      </div>
      <div id="kpis" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3"></div>
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
        <section class="lg:col-span-7 efp-panel p-5">
          <h2 class="font-[Cairo] font-bold mb-4">مسار التحويل</h2>
          <div id="funnel" class="space-y-3"></div>
        </section>
        <section class="lg:col-span-5 efp-panel p-5">
          <h2 class="font-[Cairo] font-bold mb-4">مصادر الزيارات</h2>
          <div id="sources" class="space-y-2"></div>
        </section>
        <section class="lg:col-span-4 efp-panel p-5">
          <h2 class="font-[Cairo] font-bold mb-4">أداء المنتجات</h2>
          <div id="products" class="space-y-2"></div>
        </section>
        <section class="lg:col-span-4 efp-panel p-5">
          <h2 class="font-[Cairo] font-bold mb-4">المحافظات الأكثر طلباً</h2>
          <div id="regions" class="space-y-2"></div>
        </section>
        <section class="lg:col-span-4 efp-panel p-5">
          <h2 class="font-[Cairo] font-bold mb-4">تنبيهات ذكية</h2>
          <div id="alerts" class="space-y-2"></div>
        </section>
      </div>
    </div>
  </main>
</div>
<script src="layout.js"></script>
<script>
function esc(s){return s==null?'':String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function n(v){return Number(v)||0}
function groupBy(list,key){const m=new Map();list.forEach(x=>{const k=key(x)||'direct';m.set(k,(m.get(k)||0)+1)});return [...m.entries()].sort((a,b)=>b[1]-a[1]);}
// حالات الطلب: المصدر status_code، والنص العربي شبكة أمان للطلبات القديمة بس
const STATUS_CODES=['pending','paid','processing','shipped','delivered','cancelled'];
function deriveStatusCode(text){
  const s=String(text||'').toLowerCase();
  if(!s)return'pending';
  if(/ملغي|ملغى|إلغاء|الغاء|مرتجع|returned|refund|رفض/.test(s))return'cancelled';
  if(/تم التوصيل|تم التسليم|تسليم|توصيل|deliver/.test(s))return'delivered';
  if(/مع المندوب|المندوب|تم الشحن|shipped|خرج للشحن/.test(s))return'shipped';
  if(/مدفوع|تم الدفع|دفع تم|تم السداد|paid/.test(s))return'paid';
  if(/بانتظار|انتظار|جديد|قيد التنفيذ|قيد المتابعة|في الانتظار|pending/.test(s))return'pending';
  if(/قيد التجهيز|التجهيز|تجهيز|processing/.test(s))return'processing';
  return'pending';
}
function statusCodeOf(o){
  const c=String((o&&o.status_code)||'').trim();
  return STATUS_CODES.includes(c)?c:deriveStatusCode(o&&o.status);
}
function unique(list,key){return new Set(list.map(key).filter(Boolean)).size;}
function kpi(label,value,icon){return `<div class="bg-white rounded-2xl border border-[#e2e8f0] p-4 shadow-sm"><div class="flex items-center justify-between text-[#64748b] text-sm"><span>${label}</span><span class="material-symbols-outlined text-[#4d3ceb]">${icon}</span></div><p class="text-2xl font-black mt-2">${value}</p></div>`;}
function bar(label,value,max){const pct=max?Math.round(value/max*100):0;return `<div><div class="flex justify-between text-sm mb-1"><span class="font-bold">${esc(label)}</span><span class="text-[#64748b]">${value}</span></div><div class="h-2 rounded-full bg-slate-100 overflow-hidden"><div class="h-full bg-[#4d3ceb]" style="width:${pct}%"></div></div></div>`;}
async function loadAnalytics(){
  const since=new Date();since.setDate(since.getDate()-30);
  const sinceIso=since.toISOString();
  let events,visits,orders,loadsRes;
  try{
    [events,visits,orders,loadsRes]=await Promise.all([
      fetchAll(()=>_supabase.from('store_events').select('event_name,session_id,product_id,product_name,coupon_code,source,campaign,device_type,created_at').gte('created_at',sinceIso).order('id')),
      fetchAll(()=>_supabase.from('visitor_events').select('session_id,source,device_type,created_at').gte('created_at',sinceIso).order('id')),
      fetchAll(()=>_supabase.from('orders').select('id,total,status,status_code,session_id,traffic_source,traffic_campaign,address,created_at').gte('created_at',sinceIso).order('created_at',{ascending:false}).order('id')),
      _supabase.from('visitors').select('count')
    ]);
  }catch(e){
    console.error(e);
    document.getElementById('kpis').innerHTML='<p class="text-sm text-red-500 font-bold col-span-full">فشل تحميل البيانات. تأكدي من الجداول والصلاحيات.</p>';
    return;
  }
  const sessions=unique(visits.length?visits:events,x=>x.session_id);
  // الطلبات الملغية مش بتتحسب في التحويل ولا مسار "طلب مكتمل"
  const validOrders=orders.filter(o=>statusCodeOf(o)!=='cancelled');
  const orderSessions=unique(validOrders,x=>x.session_id);
  // تحميلات الصفحات: إجمالي عداد visitors.count (مختلف عن الجلسات الفريدة)
  const pageLoads=(!loadsRes.error&&Array.isArray(loadsRes.data))?loadsRes.data.reduce((s,r)=>s+n(r.count),0):null;
  const revenue=orders.filter(o=>statusCodeOf(o)==='delivered').reduce((s,o)=>s+n(o.total),0);
  const conversion=sessions?Math.round(orderSessions/sessions*1000)/10:0;
  document.getElementById('kpis').innerHTML=[
    kpi('زوار (جلسات 30 يوم)',sessions.toLocaleString('en'),'groups'),
    kpi('إجمالي زيارات المتجر',pageLoads==null?'—':pageLoads.toLocaleString('en'),'visibility'),
    kpi('أحداث المتجر',events.length,'ads_click'),
    kpi('طلبات مربوطة',orderSessions,'shopping_bag'),
    kpi('معدل التحويل',conversion+'%','conversion_path'),
    kpi('مبيعات مكتملة',Math.round(revenue).toLocaleString('en')+' ج.م','payments')
  ].join('');
  const counts=Object.fromEntries(groupBy(events,x=>x.event_name));
  const funnel=[['زيارة',sessions],['مشاهدة منتج',counts.product_view||0],['إضافة للسلة',counts.add_to_cart||0],['بدء الدفع',counts.checkout_started||0],['بدء الدفع الإلكتروني',counts.payment_started||0],['طلب مكتمل',validOrders.length]];
  const max=Math.max(...funnel.map(x=>x[1]),1);
  document.getElementById('funnel').innerHTML=funnel.map(x=>bar(x[0],x[1],max)).join('');
  const sourceSessionMap=new Map();
  (visits.length?visits:events).forEach(x=>{const sid=String(x.session_id||'').trim();if(sid&&!sourceSessionMap.has(sid))sourceSessionMap.set(sid,x.source||'direct');});
  const sourceCounts=new Map();sourceSessionMap.forEach(src=>sourceCounts.set(src,(sourceCounts.get(src)||0)+1));
  const sourceRows=[...sourceCounts.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8);
  document.getElementById('sources').innerHTML=sourceRows.length?sourceRows.map(x=>bar(x[0],x[1],sourceRows[0][1])).join(''):'<p class="text-sm text-[#94a3b8]">لا توجد مصادر بعد.</p>';
  const prod=new Map();
  events.filter(e=>e.product_name).forEach(e=>{const cur=prod.get(e.product_name)||{views:0,carts:0,viewers:new Set()}; if(e.event_name==='product_view'){cur.views++;if(e.session_id)cur.viewers.add(e.session_id);} if(e.event_name==='add_to_cart')cur.carts++; prod.set(e.product_name,cur);});
  const prodRows=[...prod.entries()].sort((a,b)=>b[1].views-a[1].views).slice(0,8);
  document.getElementById('products').innerHTML=prodRows.length?prodRows.map(([name,v])=>`<div class="flex items-center justify-between py-2 border-b border-[#e2e8f0]"><span class="font-bold">${esc(name)}</span><span class="text-xs text-[#64748b]">${v.views} مشاهدة / ${v.viewers.size} زائر / ${v.carts} سلة</span></div>`).join(''):'<p class="text-sm text-[#94a3b8]">لا توجد أحداث منتجات بعد.</p>';
  const knownRegions=['القاهرة','الجيزة','الإسكندرية','الدقهلية','الشرقية','الغربية','المنوفية','البحيرة','القليوبية','الفيوم','بني سويف','المنيا','أسيوط','سوهاج','قنا','الأقصر','أسوان','دمياط','بورسعيد','الإسماعيلية','السويس','كفر الشيخ','مطروح','البحر الأحمر','الوادي الجديد','شمال سيناء','جنوب سيناء'];
  const regions=groupBy(orders,x=>knownRegions.find(r=>String(x.address||'').includes(r))||'غير محدد').slice(0,8);
  document.getElementById('regions').innerHTML=regions.length?regions.map(x=>bar(x[0],x[1],regions[0][1])).join(''):'<p class="text-sm text-[#94a3b8]">لا توجد عناوين كافية بعد.</p>';
  const failed=(counts.payment_failed||0), started=(counts.payment_started||0);
  const lowCartProducts=prodRows.filter(([_,v])=>v.views>=5&&v.carts===0).slice(0,3).map(([name])=>name);
  const alerts=[];
  if(started&&failed/started>.2)alerts.push('معدل فشل الدفع أعلى من 20%.');
  if(conversion&&conversion<2)alerts.push('معدل التحويل أقل من 2%.');
  lowCartProducts.forEach(p=>alerts.push('منتج عليه مشاهدات بدون إضافات للسلة: '+p));
  document.getElementById('alerts').innerHTML=alerts.length?alerts.map(a=>`<div class="p-3 rounded-xl bg-amber-50 text-amber-800 text-sm font-bold">${esc(a)}</div>`).join(''):'<div class="p-3 rounded-xl bg-emerald-50 text-emerald-800 text-sm font-bold">لا توجد تنبيهات حرجة حالياً.</div>';
}
window.onload=async function(){renderSidebar('visitor-analytics.html');const ok=await requireAdmin();if(ok)loadAnalytics();};
</script>
</body>
</html>
